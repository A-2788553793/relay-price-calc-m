[package]
name = "relay-price-calc-m"
version = "0.1.2"
edition = "2021"
rust-version = "1.90"
description = "Rust + Slint Android 中转站模型价格比较工具"
license = "MIT"
build = "build.rs"

[lib]
name = "relay_price_calc_m"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "relay-price-calc-m"
path = "src/main.rs"
required-features = ["ui"]

[features]
default = []
ui = ["dep:slint", "dep:slint-build"]

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "=1.14.1", optional = true, default-features = false, features = ["std", "compat-1-2", "backend-winit-x11", "renderer-software"] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "=1.14.1", optional = true, default-features = false, features = ["std", "compat-1-2", "backend-android-activity-06"] }

[build-dependencies]
slint-build = { version = "=1.14.1", optional = true }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

[package.metadata.android]
package = "io.github.a2788553793.relaypricecalcm"
apk_name = "relay-price-calc-m"
build_targets = ["aarch64-linux-android"]
resources = "android/res"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "relay-price-calc-m"
icon = "@drawable/ic_launcher"
theme = "@style/AppTheme"
extract_native_libs = true

[package.metadata.android.application.activity]
exported = true
config_changes = "orientation|keyboardHidden|screenSize|smallestScreenSize|screenLayout|uiMode|density"
